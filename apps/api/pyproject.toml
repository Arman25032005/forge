[project]
name = "forge-api"
version = "0.1.0"
description = "FORGE Enterprise AI Deployment & Decision Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.1.0",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.1.0",
    "structlog>=24.4.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
    "sqlglot>=25.24.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0,<5.0.0",
    "anthropic>=1.4.0,<2.0.0",
    "groq>=0.31.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) in argument defaults is the standard FastAPI DI pattern

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
